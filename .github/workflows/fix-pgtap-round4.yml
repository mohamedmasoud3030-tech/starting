name: One-shot Quick Quote pgTAP assertion repair

on:
  push:
    branches: ["arena/019ffefc-starting"]
    paths: [".github/workflows/fix-pgtap-round4.yml"]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/019ffefc-starting
          fetch-depth: 0

      - name: Align Quick Quote throws_ok expectations with PostgreSQL boundary
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("supabase/tests/quick_quote.test.sql")
          text = path.read_text()
          replacements = {
            "$$,'GUEST_COUNT_REQUIRED',null,'PER_GUEST line requires a guest count');": "$$,'P0001','GUEST_COUNT_REQUIRED','PER_GUEST line requires a guest count');",
            "$$,'PACKAGE_ALREADY_APPLIED',null,'double package apply rejected');": "$$,'P0001','PACKAGE_ALREADY_APPLIED','double package apply rejected');",
            "$$,'QUOTATION_IMMUTABLE',null,'issued quotation snapshot immutable');": "$$,'42501',null,'issued quotation snapshot cannot be directly mutated by client');",
            "$$,'QUOTATION_IMMUTABLE',null,'issued quotation lines immutable');": "$$,'42501',null,'issued quotation lines cannot be directly mutated by client');",
            "$$,'QUOTATION_NOT_ACCEPTED',null,'un-accepted quotation cannot convert');": "$$,'P0001','QUOTATION_NOT_ACCEPTED','un-accepted quotation cannot convert');",
            "$$,'EVENT_DATE_REQUIRED',null,'conversion without a date rejected');": "$$,'P0001','EVENT_DATE_REQUIRED','conversion without a date rejected');",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"assertion target missing: {old}")
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Verify focused diff
        run: |
          git diff --check
          git diff -- supabase/tests/quick_quote.test.sql

      - name: Commit assertion repairs
        run: |
          git config user.name "M7mdlab"
          git config user.email "250202280+mohamedmasoud3030-tech@users.noreply.github.com"
          git add supabase/tests/quick_quote.test.sql
          git commit -m "fix: align Quick Quote pgTAP error expectations"
          git push origin HEAD:arena/019ffefc-starting
