name: One-shot pgTAP round-two repair

on:
  push:
    branches: ["arena/019ffefc-starting"]
    paths: [".github/workflows/fix-pgtap-round2.yml"]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/019ffefc-starting
          fetch-depth: 0

      - name: Repair pgTAP compatibility and fixture UUIDs
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          events = Path("supabase/tests/events_commercial_resources.test.sql")
          text = events.read_text()
          old = "select like((select event_number from public.events where idempotency_key='11000000-0000-0000-0000-000000000001'),'EV-2026-%','readable yearly Event number');"
          new = "select ok((select event_number from public.events where idempotency_key='11000000-0000-0000-0000-000000000001') like 'EV-2026-%','readable yearly Event number');"
          if old not in text:
              raise SystemExit("events assertion target not found")
          events.write_text(text.replace(old, new, 1))

          qq = Path("supabase/tests/quick_quote.test.sql")
          text = qq.read_text()
          bad = "00000000-0000-0000-0000-0000000000p1"
          good = "00000000-0000-0000-0000-0000000000e1"
          if bad not in text:
              raise SystemExit("quick quote invalid package UUID not found")
          text = text.replace(bad, good)
          # Fail closed if a UUID-shaped fixture still contains non-hex chars.
          uuidish = re.compile(r"['\"]([0-9A-Za-z]{8}-[0-9A-Za-z]{4}-[0-9A-Za-z]{4}-[0-9A-Za-z]{4}-[0-9A-Za-z]{12})['\"]")
          invalid = sorted({u for u in uuidish.findall(text) if re.fullmatch(r"[0-9a-fA-F-]{36}", u) is None})
          if invalid:
              raise SystemExit(f"invalid UUID fixtures remain: {invalid}")
          qq.write_text(text)

          hard = Path("supabase/tests/quick_quote_hardening.test.sql")
          text = hard.read_text()
          replacements = {
              "$$,'IDEMPOTENCY_KEY_REUSED',null,'idempotency key reuse with different payload rejected');":
                  "$$,'P0001','IDEMPOTENCY_KEY_REUSED','idempotency key reuse with different payload rejected');",
              "$$,'QUOTATION_IMMUTABLE',null,'accepted quotation cannot revert to ISSUED');":
                  "$$,'P0001','QUOTATION_IMMUTABLE','accepted quotation cannot revert to ISSUED');",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"hardening assertion target not found: {old}")
              text = text.replace(old, new, 1)
          hard.write_text(text)
          PY

      - name: Verify focused diff
        run: |
          git diff --check
          git diff -- supabase/tests

      - name: Commit repairs
        run: |
          git config user.name "M7mdlab"
          git config user.email "250202280+mohamedmasoud3030-tech@users.noreply.github.com"
          git add supabase/tests
          git commit -m "fix: repair pgTAP assertions and quick quote UUID fixtures"
          git push origin HEAD:arena/019ffefc-starting
